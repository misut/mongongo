name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release validation
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run release validation
        run: |
          ./gradlew :mongongo-core:spotlessCheck :mongongo-core:jvmTest :mongongo-core:macosArm64Test
          ./gradlew :mongongo-core:publishToMavenLocal

  publish:
    name: Publish Maven artifacts
    needs: validate
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check Maven publish secrets
        shell: bash
        env:
          MAVEN_PUBLISHING_REPOSITORY_URL: ${{ secrets.MAVEN_PUBLISHING_REPOSITORY_URL }}
          MAVEN_PUBLISHING_USERNAME: ${{ secrets.MAVEN_PUBLISHING_USERNAME }}
          MAVEN_PUBLISHING_PASSWORD: ${{ secrets.MAVEN_PUBLISHING_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            MAVEN_PUBLISHING_REPOSITORY_URL \
            MAVEN_PUBLISHING_USERNAME \
            MAVEN_PUBLISHING_PASSWORD \
            SIGNING_IN_MEMORY_KEY \
            SIGNING_IN_MEMORY_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Maven publish secrets: ${missing[*]}"
            {
              echo "### Maven publish blocked"
              echo
              echo "Missing required secrets:"
              for name in "${missing[@]}"; do
                echo "- \`$name\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Drop stale OSSRH staging repositories
        shell: bash
        env:
          MAVEN_CENTRAL_NAMESPACE: io.github.misut
          MAVEN_PUBLISHING_USERNAME: ${{ secrets.MAVEN_PUBLISHING_USERNAME }}
          MAVEN_PUBLISHING_PASSWORD: ${{ secrets.MAVEN_PUBLISHING_PASSWORD }}
        run: |
          token="$(
            printf '%s:%s' "$MAVEN_PUBLISHING_USERNAME" "$MAVEN_PUBLISHING_PASSWORD" |
              base64 |
              tr -d '\n'
          )"

          repositories_json="$RUNNER_TEMP/ossrh-repositories.json"
          open_repositories="$RUNNER_TEMP/ossrh-open-repositories.txt"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=${MAVEN_CENTRAL_NAMESPACE}" \
            > "$repositories_json"

          python3 - "$repositories_json" "$open_repositories" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)

          open_keys = [
              repository["key"]
              for repository in data.get("repositories", [])
              if repository.get("state") == "open"
          ]

          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              for key in open_keys:
                  print(key, file=handle)
          PY

          if [ ! -s "$open_repositories" ]; then
            echo "No stale OSSRH staging repositories found."
            exit 0
          fi

          while IFS= read -r repository_key; do
            encoded_key="$(
              python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
                "$repository_key"
            )"
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer $token" \
              "https://ossrh-staging-api.central.sonatype.com/manual/drop/repository/${encoded_key}" \
              > /dev/null
          done < "$open_repositories"

      - name: Publish Maven artifacts
        env:
          ORG_GRADLE_PROJECT_mavenPublishingRepositoryUrl: ${{ secrets.MAVEN_PUBLISHING_REPOSITORY_URL }}
          ORG_GRADLE_PROJECT_mavenPublishingUsername: ${{ secrets.MAVEN_PUBLISHING_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPublishingPassword: ${{ secrets.MAVEN_PUBLISHING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew :mongongo-core:publishAllPublicationsToMavenCentralRepository

      - name: Upload deployment to Central Portal
        shell: bash
        env:
          MAVEN_CENTRAL_NAMESPACE: io.github.misut
          MAVEN_PUBLISHING_USERNAME: ${{ secrets.MAVEN_PUBLISHING_USERNAME }}
          MAVEN_PUBLISHING_PASSWORD: ${{ secrets.MAVEN_PUBLISHING_PASSWORD }}
        run: |
          token="$(
            printf '%s:%s' "$MAVEN_PUBLISHING_USERNAME" "$MAVEN_PUBLISHING_PASSWORD" |
              base64 |
              tr -d '\n'
          )"

          repositories_json="$RUNNER_TEMP/ossrh-repositories.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=${MAVEN_CENTRAL_NAMESPACE}" \
            > "$repositories_json"

          repository_key="$(
            python3 - "$repositories_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)

          open_keys = [
              repository["key"]
              for repository in data.get("repositories", [])
              if repository.get("state") == "open"
          ]

          if len(open_keys) != 1:
              print(
                  f"Expected exactly one open OSSRH staging repository, found {len(open_keys)}.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(open_keys[0])
          PY
          )"

          encoded_key="$(
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
              "$repository_key"
          )"

          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/repository/${encoded_key}?publishing_type=automatic"

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file docs/release-notes/v0.1.md
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file docs/release-notes/v0.1.md
          fi
